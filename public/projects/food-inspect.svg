    <circle cx="980" cy="200" r="10" fill="#3a434e"/>
    <circle cx="620" cy="380" r="10" fill="#3a434e"/>
    <circle cx="1040" cy="400" r="10" fill="#3a434e"/>
  </g>
  <!-- listing panel -->
  <rect x="40" y="88" width="400" height="406" fill="#1a1f26"/>
  <rect x="64" y="112" width="352" height="110" rx="8" fill="#2b323b"/>
  <text x="64" y="262" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#e8ecf1">Polanco Restaurant</text>
  <!-- grade badge -->
  <rect x="300" y="238" width="116" height="34" rx="8" fill="#0b0d10" stroke="#38bdf8"/>
