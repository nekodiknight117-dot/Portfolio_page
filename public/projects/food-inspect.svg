<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="FoodInspect placeholder screenshot">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="streets" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60H120M60 0V120" stroke="#2b323b" stroke-width="6"/>
      <path d="M0 20H120M0 100H120M20 0V120M100 0V120" stroke="#232931" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="540" fill="#0b0d10"/>
  <rect width="1200" height="540" fill="url(#grid)"/>
  <rect x="40" y="40" width="1120" height="460" rx="14" fill="#15181d" stroke="#2b323b"/>
  <rect x="40" y="40" width="1120" height="48" rx="14" fill="#1f242b"/>
  <rect x="40" y="74" width="1120" height="14" fill="#1f242b"/>
  <circle cx="70" cy="64" r="6" fill="#3b82f6"/>
  <circle cx="92" cy="64" r="6" fill="#38bdf8"/>
  <circle cx="114" cy="64" r="6" fill="#3a434e"/>
  <rect x="440" y="54" width="320" height="20" rx="10" fill="#0b0d10"/>
  <!-- map area -->
  <rect x="440" y="88" width="720" height="406" fill="#181d23"/>
  <rect x="440" y="88" width="720" height="406" fill="url(#streets)"/>
  <!-- map pins -->
  <g>
    <circle cx="700" cy="230" r="14" fill="#3b82f6"/>
    <circle cx="700" cy="230" r="5" fill="#ffffff"/>
