  <rect x="350" y="243" width="24" height="24" rx="5" fill="#38bdf8"/>
  <text x="362" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0b0d10">A</text>
  <text x="384" y="261" font-family="Arial, sans-serif" font-size="11" fill="#e8ecf1">Grade</text>
  <rect x="64" y="280" width="140" height="10" rx="3" fill="#3a434e"/>
  <text x="64" y="316" font-family="Arial, sans-serif" font-size="13" fill="#9aa5b1">Mexican restaurant</text>
  <g fill="#3a434e">
    <rect x="64" y="340" width="352" height="8" rx="3"/>
    <rect x="64" y="358" width="300" height="8" rx="3"/>
