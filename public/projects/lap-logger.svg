<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="LapLogger placeholder screenshot">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="540" fill="#0b0d10"/>
  <rect width="1200" height="540" fill="url(#grid)"/>
  <!-- window chrome -->
  <rect x="40" y="40" width="1120" height="460" rx="14" fill="#15181d" stroke="#2b323b"/>
  <rect x="40" y="40" width="1120" height="48" rx="14" fill="#1f242b"/>
  <rect x="40" y="74" width="1120" height="14" fill="#1f242b"/>
  <circle cx="70" cy="64" r="6" fill="#e10600"/>
  <circle cx="92" cy="64" r="6" fill="#f5a623"/>
  <circle cx="114" cy="64" r="6" fill="#3a434e"/>
  <rect x="440" y="54" width="320" height="20" rx="10" fill="#0b0d10"/>
  <!-- content -->
  <text x="80" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#e8ecf1" letter-spacing="2">LAPLOGGER</text>
  <text x="1120" y="124" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#6b7684" letter-spacing="3">PLACEHOLDER SCREENSHOT</text>
  
        <polyline fill="none" stroke="#e10600" stroke-width="3" points="80,420 160,300 240,340 320,220 400,260 480,180 560,240 640,160 720,200 800,120 880,180 960,140 1040,200 1120,160"/>
        <polyline fill="none" stroke="#9aa4b1" stroke-width="2" stroke-dasharray="6 6" points="80,440 160,360 240,380 320,300 400,320 480,260 560,300 640,240 720,280 800,220 880,260 960,230 1040,270 1120,240"/>
        <line x1="640" y1="110" x2="640" y2="470" stroke="#e8ecf1" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- racing stripe -->
  <rect x="40" y="494" width="1120" height="4" fill="#e10600"/>
</svg>
