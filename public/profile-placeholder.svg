<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Placeholder profile photo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f242b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#15181d"/>
      <rect width="6" height="6" fill="#1a1e24"/>
      <rect x="6" y="6" width="6" height="6" fill="#1a1e24"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#carbon)"/>
  <rect width="400" height="400" fill="url(#bg)" opacity="0.7"/>
  <!-- silhouette -->
  <circle cx="200" cy="150" r="70" fill="#3a434e"/>
  <path d="M60 400 C60 290 140 250 200 250 C260 250 340 290 340 400 Z" fill="#3a434e"/>
  <!-- racing stripe -->
  <rect x="0" y="372" width="400" height="6" fill="#e10600"/>
  <rect x="0" y="380" width="400" height="3" fill="#e8ecf1"/>
  <rect x="0" y="385" width="400" height="6" fill="#e10600"/>
  <text x="200" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9aa4b1" letter-spacing="4">YOUR PHOTO HERE</text>
</svg>
