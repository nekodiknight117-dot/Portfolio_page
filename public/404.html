<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback (https://github.com/rafgraph/spa-github-pages).
      // GitHub serves this file for unknown paths. We encode the requested path
      // into the query string and bounce to index.html, which decodes it below
      // (see the inline script in index.html) and restores the original URL.
      //
      // pathSegmentsToKeep: 0 for a user/org site (username.github.io),
      //                     1 for a project site (username.github.io/repo).
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
